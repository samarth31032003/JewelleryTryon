name: Build and Release Windows EXE

on:
  push:
    branches:
      - release # Only triggers when code is pushed to the 'release' branch

permissions:
  contents: write # Required to allow GitHub to create the Release page

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Matches your development environment

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Generate Auto-Incrementing Version
        id: version
        # Creates a version like 1.0.1, 1.0.2 based on the GitHub run count
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Build with PyInstaller
        # Your exact working PyInstaller command
        run: |
          pyinstaller --clean --noconfirm --onedir --console --add-data "data/assets;data/assets" --hidden-import mediapipe --collect-data mediapipe --icon "data/assets/icon.png" main.py

      - name: Compile Inno Setup Installer
        run: |
          $version = "${env:VERSION}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AR Jewelry TryOn v${{ env.VERSION }}
          body: |
            Automated release for AR Jewelry TryOn.
            Version: v${{ env.VERSION }}
            Publisher: Aspiron IT solution
          files: Output/AR_Jewelry_TryOn_Setup_v${{ env.VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}